name: Deploy demo

# The static demo: the real app running against Postgres-compiled-to-WASM, with
# no server and no database behind it. See the README's "Static demo build".
#
# The seed is built here rather than committed, so it can never drift from the
# schema: a throwaway Postgres is migrated and seeded with the same
# scripts/seed-workspace.ts the dev environment uses, dumped, and replayed into
# a PGlite snapshot the browser loads once.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a run that is
# already publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    services:
      postgres:
        # 16 to match the client on the ubuntu-24.04 runner: pg_dump refuses to
        # dump from a server newer than itself. The dump is plain SQL with
        # --inserts, so the version only has to be old enough for PGlite (17) to
        # replay it, which is the safe direction.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      # scripts/demo-seed.ts shells out to psql and pg_dump. The runner already
      # has a 16 client, but say so explicitly so a runner-image change can't
      # silently swap the version out from under the service above.
      - name: Install postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      # A broken build should not replace a working demo.
      - name: Typecheck and unit tests
        run: |
          bun run check
          bun run test

      - name: Build the seed snapshot
        env:
          DEMO_SEED_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bun run demo:seed

      - name: Build the demo
        env:
          # A project site is served from /<repo>, so every asset path needs it.
          DEMO_BASE: /${{ github.event.repository.name }}
        run: bun run demo:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build-demo

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
