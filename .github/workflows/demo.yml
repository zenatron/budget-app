name: Deploy demo

# The static demo: the real app running against Postgres-compiled-to-WASM, with
# no server and no database behind it. See the README's "Static demo build".
#
# The build runs here rather than in Cloudflare's own Git integration because
# the seed needs a real Postgres to migrate, seed and pg_dump — which a Pages
# build container does not provide. Cloudflare only receives the finished
# directory, uploaded with Wrangler.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; queue instead of cancelling, so a run that is
# already publishing is allowed to finish.
concurrency:
  group: demo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Lets wrangler-action report the deployment back onto the commit.
      deployments: write

    services:
      postgres:
        # 16 to match the client on the ubuntu-24.04 runner: pg_dump refuses to
        # dump from a server newer than itself. The dump is plain SQL with
        # --inserts, so the version only has to be old enough for PGlite (17) to
        # replay it, which is the safe direction.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      # scripts/demo-seed.ts shells out to psql and pg_dump. The runner already
      # has a 16 client, but say so explicitly so a runner-image change cannot
      # silently swap the version out from under the service above.
      - name: Install postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      # A broken build should not replace a working demo.
      - name: Typecheck and unit tests
        run: |
          bun run check
          bun run test

      - name: Build the seed snapshot
        env:
          DEMO_SEED_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bun run demo:seed

      # No DEMO_BASE: ledger.pvi.sh serves the demo from its root.
      # DEMO_HOST=cloudflare is the default, and matters — a 404.html would turn
      # Cloudflare's SPA fallback off and break every deep link.
      - name: Build the demo
        env:
          DEMO_HOST: cloudflare
        run: bun run demo:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy build-demo --project-name=ledger-demo --branch=main
